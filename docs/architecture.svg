<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 830" width="1040" height="830" role="img" aria-labelledby="t d">
  <title id="t">FaultIQ Django app architecture</title>
  <desc id="d">Browser pages call the Render web service, which runs the Django app. Django reads and writes PostgreSQL and the media store, and calls the AI modules in the same process: fault detection with an Isolation Forest and physics rules, and a diagnostic assistant with embeddings and TF-IDF.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8eeee"/>
    </marker>
    <style>
      .bg{fill:#121818}
      .box{fill:#1b2323;stroke:#9aa5a5;stroke-width:1.4}
      .h{font:700 17px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#f2f5f5}
      .s{font:400 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#aeb9b9}
      .lane{font:400 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8fa0a0}
      .lh{font:700 19px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#f2f5f5}
      .ls{font:400 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#aeb9b9}
      .step{fill:#1b2323;stroke:#9aa5a5;stroke-width:1.3}
      .st{font:600 13.5px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#f2f5f5}
      .ln{stroke:#e8eeee;stroke-width:1.6;fill:none}
      .teal{fill:#5fd4b8}
    </style>
  </defs>
  <rect class="bg" width="1040" height="830" rx="14"/>

  <!-- Layer labels -->
  <text class="lh" x="40" y="72">Client</text><text class="ls" x="40" y="94">browser</text>
  <text class="lh" x="40" y="212">Edge</text><text class="ls" x="40" y="234">Render</text>
  <text class="lh" x="40" y="352">App</text><text class="ls" x="40" y="374">Django 5.2</text>
  <text class="lh teal" x="40" y="482">Data</text><text class="ls" x="40" y="504">Django ORM</text>
  <text class="lh" x="40" y="660">AI / ML</text><text class="ls" x="40" y="682">in-process</text>

  <!-- Client -->
  <g text-anchor="middle">
    <rect class="box" x="230" y="44" width="167" height="56" rx="7"/><text class="h" x="313.5" y="78">Overview</text>
    <rect class="box" x="417" y="44" width="167" height="56" rx="7"/><text class="h" x="500.5" y="78">Fault events</text>
    <rect class="box" x="604" y="44" width="167" height="56" rx="7"/><text class="h" x="687.5" y="78">AI assistant</text>
    <rect class="box" x="791" y="44" width="167" height="56" rx="7"/><text class="h" x="874.5" y="78">Fault library</text>
  </g>
  <line class="ln" x1="594" y1="100" x2="594" y2="178" marker-end="url(#a)"/>
  <text class="s" x="608" y="144">HTTPS · forms · Chart.js</text>

  <!-- Edge -->
  <rect class="box" x="230" y="182" width="728" height="64" rx="7"/>
  <text class="h" x="594" y="208" text-anchor="middle">Render web service</text>
  <text class="s" x="594" y="232" text-anchor="middle">TLS · Gunicorn · WhiteNoise static files</text>
  <line class="ln" x1="594" y1="246" x2="594" y2="318" marker-end="url(#a)"/>
  <text class="s" x="608" y="287">WSGI request</text>

  <!-- App -->
  <rect class="box" x="230" y="322" width="728" height="64" rx="7"/>
  <text class="h" x="594" y="348" text-anchor="middle">Django app · diagnostics</text>
  <text class="s" x="594" y="372" text-anchor="middle">views · forms + validation · login · owner checks · JSON API · rate limit</text>


  <!-- Data -->
  <rect x="214" y="440" width="760" height="120" rx="10" fill="#17302b" stroke="#5fd4b8" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text class="s teal" x="962" y="458" text-anchor="end" style="fill:#5fd4b8">single source of truth</text>
  <rect class="box" x="232" y="466" width="470" height="76" rx="7"/>
  <text class="h" x="467" y="496" text-anchor="middle">PostgreSQL (SQLite locally)</text>
  <text class="s" x="467" y="522" text-anchor="middle">sites · units · analyses · events · library</text>
  <rect class="box" x="722" y="466" width="234" height="76" rx="7"/>
  <text class="h" x="839" y="496" text-anchor="middle">Media store</text>
  <text class="s" x="839" y="522" text-anchor="middle">uploaded CSVs</text>

  <!-- App to data (drawn after the data layer so the arrowheads show) -->
  <line class="ln" x1="420" y1="386" x2="420" y2="464" marker-end="url(#a)"/>
  <text class="s" x="434" y="420">ORM read · write</text>
  <line class="ln" x1="750" y1="386" x2="750" y2="464" marker-end="url(#a)"/>
  <text class="s" x="764" y="420">save upload</text>

  <!-- AI to data -->
  <line class="ln" x1="330" y1="610" x2="330" y2="546" marker-end="url(#a)"/>
  <text class="s" x="344" y="588">write analyses · events</text>
  <line class="ln" x1="600" y1="610" x2="600" y2="546" marker-end="url(#a)"/>
  <text class="s" x="614" y="588">read library · cases</text>

  <!-- App calls AI in-process (right side) -->
  <path class="ln" d="M958 354 H998 V700 H978" marker-end="url(#a)"/>
  <text class="s" x="1012" y="527" text-anchor="middle" transform="rotate(90 1012 527)">calls (services.py)</text>

  <!-- AI / ML -->
  <rect class="box" x="214" y="612" width="760" height="196" rx="10"/>
  <text class="h" x="594" y="640" text-anchor="middle">AI modules · diagnostics/ai</text>

  <text class="lane" x="236" y="666">fault detection · scikit-learn</text>
  <g text-anchor="middle">
    <rect class="step" x="236" y="676" width="128" height="40" rx="6"/><text class="st" x="300" y="701">Validate CSV</text>
    <rect class="step" x="380" y="676" width="128" height="40" rx="6"/><text class="st" x="444" y="701">Hourly features</text>
    <rect class="step" x="524" y="676" width="128" height="40" rx="6"/><text class="st" x="588" y="701">Isolation Forest</text>
    <rect class="step" x="668" y="676" width="128" height="40" rx="6"/><text class="st" x="732" y="701">Physics rules</text>
    <rect class="step" x="812" y="676" width="128" height="40" rx="6"/><text class="st" x="876" y="701">Fault events</text>
  </g>
  <text class="lane" x="236" y="740">diagnostic assistant · bge-small-en-v1.5 · TF-IDF</text>
  <g text-anchor="middle">
    <rect class="step" x="236" y="750" width="128" height="40" rx="6"/><text class="st" x="300" y="775">Clean query</text>
    <rect class="step" x="380" y="750" width="128" height="40" rx="6"/><text class="st" x="444" y="775">Embed + TF-IDF</text>
    <rect class="step" x="524" y="750" width="128" height="40" rx="6"/><text class="st" x="588" y="775">Blend + rank</text>
    <rect class="step" x="668" y="750" width="128" height="40" rx="6"/><text class="st" x="732" y="775">Confidence gate</text>
    <rect class="step" x="812" y="750" width="128" height="40" rx="6"/><text class="st" x="876" y="775">Causes + checks</text>
  </g>
  <g class="ln">
    <line x1="364" y1="696" x2="378" y2="696" marker-end="url(#a)"/><line x1="508" y1="696" x2="522" y2="696" marker-end="url(#a)"/>
    <line x1="652" y1="696" x2="666" y2="696" marker-end="url(#a)"/><line x1="796" y1="696" x2="810" y2="696" marker-end="url(#a)"/>
    <line x1="364" y1="770" x2="378" y2="770" marker-end="url(#a)"/><line x1="508" y1="770" x2="522" y2="770" marker-end="url(#a)"/>
    <line x1="652" y1="770" x2="666" y2="770" marker-end="url(#a)"/><line x1="796" y1="770" x2="810" y2="770" marker-end="url(#a)"/>
  </g>
</svg>
