# Render Blueprint: Django web app + free PostgreSQL. Render > New > Blueprint > pick this repo.
services:
  - type: web
    name: faultiq-web
    runtime: python
    rootDir: web
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: AI_EMBEDDINGS
        value: tfidf # the free plan has 512 MB RAM; the embedding model needs about 540 MB
      - key: DEMO_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: faultiq-db
          property: connectionString
databases:
  - name: faultiq-db
    plan: free
