{% extends "base.html" %}{% block title %}Delete{% endblock %}
{% block content %}<div class="card" style="max-width:620px"><h1>Delete {{ object }}?</h1><p>This removes the unit, its analyses and fault events. It cannot be undone.</p>
<form method="post">{% csrf_token %}<button class="btn danger">Delete</button> <a class="btn ghost" href="{{ object.get_absolute_url }}">Cancel</a></form></div>{% endblock %}
