{% extends "base.html" %}{% block title %}{{ fault.name }}{% endblock %}
{% block content %}<hgroup><h2>{{ fault.name }}</h2><p>{{ fault.component }}</p></hgroup>
<article><h5>Symptoms</h5><p>{{ fault.symptoms }}</p><h5>Likely causes</h5><p>{{ fault.causes }}</p><h5>What to check</h5><p>{{ fault.checks }}</p></article>
<a href="{% url 'fault_list' %}">Back to the library</a>{% endblock %}
