{% extends "base.html" %}{% block title %}Fault library{% endblock %}
{% block content %}
<h2>Fault library</h2>
<form method="get" class="grid"><input type="search" name="q" value="{{ q }}" placeholder="Search symptoms or causes" aria-label="Search"><select name="component" aria-label="Component"><option value="">All components</option>{% for c in components %}<option {% if c == component %}selected{% endif %}>{{ c }}</option>{% endfor %}</select><button>Search</button></form>
{% for f in faults %}<article><header><a href="{{ f.get_absolute_url }}"><b>{{ f.name }}</b></a> <span class="badge">{{ f.component }}</span></header>{{ f.symptoms|truncatewords:30 }}</article>
{% empty %}<p>No faults match your search.</p>{% endfor %}
{% endblock %}
