[project]
name = "faultiq-pipeline"
version = "0.1.0"
description = "FaultIQ FDD pipeline and worker: HVAC fault detection and diagnostics for rooftop units."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.5",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.2",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
eda = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["faultiq", "worker"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
packages = ["faultiq", "worker"]

[[tool.mypy.overrides]]
# scikit-learn ships without type information.
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
